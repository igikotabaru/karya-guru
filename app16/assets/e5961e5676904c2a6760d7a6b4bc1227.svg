<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="584" height="427" viewBox="0,0,584,427"><g transform="translate(29.5,-1)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-29.5,428v-427h584v427z" fill="#00e8aa" stroke-width="0"/><text transform="translate(28.75562,80.7836) scale(0.28651,0.29267)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Menebang pohon sembarangan membantu </tspan><tspan x="0" dy="46.150000000000006px">menjaga hutan. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Menanam kembali pohon yang ditebang </tspan><tspan x="0" dy="46.150000000000006px">termasuk pelestarian alam. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Membuang sampah ke sungai membuat</tspan><tspan x="0" dy="46.150000000000006px"> ikan hidup sehat. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Melindungi hewan langka termasuk </tspan><tspan x="0" dy="46.150000000000006px">tindakan baik. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Berburu hewan langka membuat alam </tspan><tspan x="0" dy="46.150000000000006px">seimbang.</tspan></text><path d="M152,14c0,-1.38071 1.11929,-2.5 2.5,-2.5c1.38071,0 2.5,1.11929 2.5,2.5c0,1.38071 -1.11929,2.5 -2.5,2.5c-1.38071,0 -2.5,-1.11929 -2.5,-2.5z" fill="#0090ff" stroke-width="0.5"/></g></g></svg>