<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="594" height="468" viewBox="0,0,594,468"><g transform="translate(39.5,2)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-39.5,466v-468h594v468z" fill="#00e8aa" stroke-width="0"/><text transform="translate(21.16679,95.15) scale(0.2972,0.33099)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Sapi berasal dari telur.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Semua hewan mengalami perubahan </tspan><tspan x="0" dy="46.150000000000006px">bentuk yang berbeda.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Katak dapat menetas dari telur dan </tspan><tspan x="0" dy="46.150000000000006px">dapt melahirkan.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Manusia mengalami masa bayi.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Telur adalah awal dari siklus hidup gajah.</tspan></text></g></g></svg>